name: Fadime ESP32-S3 Firmware (Test)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: espressif/idf:v6.1
    steps:
      - name: Checkout Fadime integration files
        uses: actions/checkout@v4
      - name: Fetch official Xiaozhi source
        shell: bash
        run: |
          git clone --depth 1 https://github.com/78/xiaozhi-esp32.git xiaozhi
      - name: Configure Fadime 240x240 7-pin screen
        shell: bash
        working-directory: xiaozhi
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("main/boards/bread-compact-wifi-lcd/config.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data["type"] == "bread-compact-wifi-lcd"
          assert data["target"] == "esp32s3"
          variant = next(v for v in data["builds"] if v["name"] == "bread-compact-wifi-lcd")
          variant["sdkconfig_append"] = ["CONFIG_LCD_ST7789_240X240_7PIN=y"]
          p.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          print(p.read_text())
          header = Path("main/boards/bread-compact-wifi-lcd/config.h").read_text()
          for setting in (
              "#define DISPLAY_CLK_PIN       GPIO_NUM_21",
              "#define DISPLAY_MOSI_PIN      GPIO_NUM_47",
              "#define DISPLAY_RST_PIN       GPIO_NUM_45",
              "#define DISPLAY_DC_PIN        GPIO_NUM_40",
              "#define DISPLAY_BACKLIGHT_PIN GPIO_NUM_42",
              "CONFIG_LCD_ST7789_240X240_7PIN",
          ):
              assert setting in header, f"Missing expected setting: {setting}"
          print("Fadime GPIO/display profile verified")
          PY
      - name: Add optional Fadime heartbeat client to board
        shell: bash
        run: |
          cp firmware/fadime_heartbeat.inc xiaozhi/main/boards/bread-compact-wifi-lcd/fadime_heartbeat.inc
          python - <<'PY'
          from pathlib import Path
          p = Path("xiaozhi/main/boards/bread-compact-wifi-lcd/compact_wifi_board_lcd.cc")
          src = p.read_text(encoding="utf-8")
          assert "DECLARE_BOARD(CompactWifiBoardLCD);" in src
          assert "        InitializeTools();" in src
          src = src.replace('#define TAG "CompactWifiBoardLCD"',
                            'static void FadimeStartHeartbeat();' + chr(10) + '#define TAG "CompactWifiBoardLCD"')
          src = src.replace("        InitializeTools();",
                            "        InitializeTools();" + chr(10) + "        FadimeStartHeartbeat();")
          src = src.replace("DECLARE_BOARD(CompactWifiBoardLCD);",
                            '#include "fadime_heartbeat.inc"' + chr(10) + "DECLARE_BOARD(CompactWifiBoardLCD);")
          p.write_text(src, encoding="utf-8")
          cm = Path("xiaozhi/main/CMakeLists.txt")
          cm_src = cm.read_text(encoding="utf-8")
          key = "                    PRIV_REQUIRES"
          assert key in cm_src
          cm.write_text(cm_src.replace(key, "                    PRIV_REQUIRES" + chr(10) + "                        esp_http_client" + chr(10) + "                        esp-tls", 1), encoding="utf-8")
          PY
      - name: Add Fadime USB serial pairing listener
        shell: bash
        run: |
          cp firmware/fadime_usb_pair.inc xiaozhi/main/boards/bread-compact-wifi-lcd/fadime_usb_pair.inc
          python - <<'PY'
          from pathlib import Path
          p = Path("xiaozhi/main/boards/bread-compact-wifi-lcd/compact_wifi_board_lcd.cc")
          src = p.read_text(encoding="utf-8")
          assert "        FadimeStartHeartbeat();" in src
          assert "DECLARE_BOARD(CompactWifiBoardLCD);" in src
          src = src.replace('#define TAG "CompactWifiBoardLCD"',
                            'static void FadimeStartUsbPairing();' + chr(10) + '#define TAG "CompactWifiBoardLCD"')
          src = src.replace("        FadimeStartHeartbeat();",
                            "        FadimeStartHeartbeat();" + chr(10) + "        FadimeStartUsbPairing();")
          src = src.replace("DECLARE_BOARD(CompactWifiBoardLCD);",
                            '#include "fadime_usb_pair.inc"' + chr(10) + "DECLARE_BOARD(CompactWifiBoardLCD);")
          p.write_text(src, encoding="utf-8")
          PY
      - name: Compile firmware (ESP-IDF)
        shell: bash
        working-directory: xiaozhi
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py bread-compact-wifi-lcd --name bread-compact-wifi-lcd --language tr-TR --wake-word disabled
      - name: Verify firmware
        shell: bash
        run: |
          test -s xiaozhi/build/merged-binary.bin
          sha256sum xiaozhi/build/merged-binary.bin
      - name: Create firmware provenance manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path("xiaozhi")
          binary = root / "build/merged-binary.bin"
          source_commit = subprocess.check_output(
              ["git", "-C", str(root), "rev-parse", "HEAD"], text=True
          ).strip()
          manifest = {
              "project": "Fadime ESP32-S3",
              "firmware_type": "merged-full-flash-test-image",
              "ota_compatible": False,
              "board": "bread-compact-wifi-lcd",
              "display": "ST7789 240x240 7PIN",
              "firmware_language": "tr-TR",
              "wake_word": "disabled",
              "upstream_commit": source_commit,
              "sha256": hashlib.sha256(binary.read_bytes()).hexdigest(),
              "file": "merged-binary.bin"
          }
          (root / "build/firmware-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(manifest, indent=2))
          PY
      - name: Save TEST firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: fadime-esp32s3-test-firmware
          path: |
            xiaozhi/build/merged-binary.bin
            xiaozhi/build/firmware-manifest.json
          if-no-files-found: error
